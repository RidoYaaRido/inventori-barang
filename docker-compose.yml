version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    working_dir: /app
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=inventory_db
      - DB_USERNAME=inventory_user
      - DB_PASSWORD=inventory_pass
      - QUEUE_CONNECTION=sync
    networks:
      - inventory_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: inventory_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/app
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - inventory_network
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: inventory_mysql
    environment:
      MYSQL_DATABASE: inventory_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inventory_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_password
    ports:
      - "8080:80"
    networks:
      - inventory_network
    depends_on:
      - mysql

volumes:
  mysql_data:

networks:
  inventory_network:
    driver: bridge
